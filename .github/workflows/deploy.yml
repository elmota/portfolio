name: Deploy a GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Permisos mínimos necesarios para publicar en Pages
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Las actions están fijadas por SHA (versión indicada en el comentario) para evitar
      # que una etiqueta movida ejecute código distinto. Actualizar revisando cada release.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      # pnpm se toma del campo "packageManager" de package.json (pnpm 10.34.9)
      - name: Activar pnpm
        run: corepack enable

      - name: Instalar dependencias (lockfile congelado)
        run: pnpm install --frozen-lockfile

      # Si el repo se llama <usuario>.github.io el sitio vive en la raíz; si no, en /<repo>
      - name: Calcular URL y base
        run: |
          REPO="${GITHUB_REPOSITORY#*/}"
          OWNER="${GITHUB_REPOSITORY_OWNER}"
          echo "SITE_URL=https://${OWNER}.github.io" >> "$GITHUB_ENV"
          case "$REPO" in
            *.github.io) echo "BASE_PATH=/" >> "$GITHUB_ENV" ;;
            *)           echo "BASE_PATH=/${REPO}" >> "$GITHUB_ENV" ;;
          esac

      - name: Compilar
        run: pnpm build

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
